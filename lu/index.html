<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lu</title>
<link rel="stylesheet" href="ui/lu-ds.css">
<link rel="stylesheet" href="ui/nha.css">
</head>
<body class="nha-body">
<div class="nha-bg" id="nen"></div>
<main class="nha" id="nha">
  <div class="nha-top">
    <div class="kid"><span class="mat"><img id="kid-anh" alt=""></span><span id="kid-ten">Bé</span></div>
    <div class="day-dau" id="day-dau"></div>
    <button class="rbtn" id="bo-me" aria-label="Khu bố mẹ, giữ 2 giây"><span class="bar"></span></button>
  </div>
  <section class="nha-main" aria-label="Buổi học hôm nay">
    <div class="loi"><span id="loi-chu"></span><button class="rbtn kem" id="nghe" aria-label="Nghe lại"></button></div>
    <img class="lu-dung" id="lu" alt="">
    <a class="hom-nay" id="hom-nay" href="#"><div class="bia" id="bia"><span class="so" id="so-buoi"></span></div>
      <div class="duoi"><div class="trai"><div class="ten" id="ten-buoi"></div><div class="cham" id="cham"></div></div><span class="choi" id="choi"></span></div></a>
    <a class="tat-ca" href="buoi.html" id="tat-ca"><span class="ic" id="ic-duong"></span>Tất cả buổi học</a>
  </section>
  <aside class="nha-rail" aria-label="Luyện tập">
    <h2><span id="ic-nha"></span>Luyện tập</h2>
    <div class="cong-luoi" id="cong"></div>
  </aside>
</main>
<script type="module">
import { taiDuLieu, moAmThanh, khuBoMe, congIcon, SVG, dayDau } from './core/nha.js';
import { esc } from './core/lu-core.js';
const D = await taiDuLieu(); const { cfg, voice } = D; const $ = id => document.getElementById(id);
$('bo-me').insertAdjacentHTML('beforeend', SVG.khoa); $('nghe').innerHTML = SVG.loa; $('choi').innerHTML = SVG.choi;
$('ic-duong').innerHTML = SVG.duong; $('ic-nha').innerHTML = SVG.nha;
$('kid-anh').src = D.luKid; $('kid-ten').textContent = D.kv()['nha:ten'] || 'Bé';
const qs = D.p.toString(); if (qs) $('tat-ca').href = 'buoi.html?' + qs;

// Buổi hôm nay
const b = D.homNay; const cd = D.chuDe[(b ? b.chuDe : 10) - 1];
$('nen').style.backgroundImage = `url("${cd.nen}")`;
{ const cdb = cd.buoi; $('day-dau').innerHTML = dayDau(cdb.length, i => D.daXong(cdb[i].id), b ? cdb.findIndex(x => x.id === b.id) : -1); }
const coBuoiXong = D.tatCa.some(x => D.daXong(x.id));
let loi, pose = 'chi', link = null;
if (!b) { loi = cfg.loi.xong; pose = 'khen'; }
else {
  const goi = await D.goi(b.id);
  $('so-buoi').textContent = 'Buổi ' + b.so;
  $('ten-buoi').textContent = goi?.title || b.ten;
  const bia = goi && (goi.hub?.backdrop?.id || goi.stages?.[0]?.backdrop?.id);
  const areg = await (await fetch('registry/assets.json')).json();
  const anh = bia && areg.assets.find(a => a.slot === bia && a.trang_thai === 'da_duyet');
  $('bia').style.backgroundImage = `url("${anh ? anh.path : cd.nen}")`;
  const n = goi?.stages?.length || 12; const xong = new Set(D.kv()['resume:' + b.id]?.done || []);
  $('cham').innerHTML = Array.from({ length: n }, (_, i) => xong.has(i) ? SVG.hatXong : SVG.hatCho).join('');
  if (goi) { link = D.linkBuoi(b, goi.__nhap); $('hom-nay').href = link; loi = coBuoiXong ? cfg.loi.hoc_tiep : cfg.loi.bat_dau; }
  else { $('hom-nay').classList.add('cho'); $('hom-nay').removeAttribute('href'); $('hom-nay').setAttribute('aria-disabled', 'true'); loi = cfg.loi.sap_co; pose = 'vay'; }
}
if (!b) { $('hom-nay').hidden = true; }
$('hom-nay').setAttribute('aria-label', b ? `Buổi ${b.so}` : '');
$('lu').src = cfg.lu[pose]; $('loi-chu').textContent = loi;
$('hom-nay').addEventListener('click', e => { if (!link) { e.preventDefault(); voice.say(loi); } });

// 12 cổng luyện tập
$('cong').innerHTML = D.congs.map(c => {
  const mo = c.trang_thai === 'mo';
  // cổng mở mà bé chưa vào lần nào thì sáng vàng (có bài mới); cổng sắp mở có ổ khóa gỗ nhỏ ở góc
  const daVao = Object.keys(D.kv()['cong:sao'] || {}).some(k => k.startsWith(c.id));
  const cls = mo ? (daVao ? 'mo' : 'mo moi') : 'sap';
  return `<a class="cong ${cls}" ${mo ? `href="cong.html?cong=${esc(c.id)}"` : 'role="button" aria-disabled="true" tabindex="0"'} data-cong="${esc(c.id)}" aria-label="${esc(c.ten)}"><span class="hinh">${congIcon(c)}</span><span class="nhan">${esc(c.ten)}</span>${mo ? '' : `<span class="o-khoa">${SVG.khoa}</span>`}</a>`;
}).join('');
$('cong').addEventListener('click', e => { const a = e.target.closest('.cong.sap'); if (a) { e.preventDefault(); voice.say(cfg.loi.cong_sap_mo); } });

$('nghe').onclick = () => { voice.stop(); voice.say(loi); };
moAmThanh(voice, () => setTimeout(() => { if (!voice.busy) voice.say(loi); }, 50));
khuBoMe($('bo-me'), D, { fast: D.fast });
window.__luNha = { loi, link, homNay: b?.id || null, ready: true };
</script>
</body>
</html>
