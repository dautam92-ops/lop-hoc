<title>Lớp Học Của Hai Chị Em</title>

<style>
/* Layout: one screen at a time (chọn bé → bản đồ bài → trò chơi), big touch targets for small fingers */
:root{
  --sky:#fff7ec; --ink:#2b2340; --muted:#6f6787; --card:#ffffff; --line:#eee3d3;
  --sun:#ffb020; --berry:#ff5d73; --leaf:#22b07d; --sea:#2f80ed; --grape:#7b61ff;
  --good:#22b07d; --bad:#ff5d73;
  --display:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
.emo{font-family:'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji',sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:56px}
.back{width:56px;height:56px;border-radius:18px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:26px;flex:none}
.top h2{font-size:clamp(22px,4vw,32px);flex:1;min-width:0}
.starbox{background:var(--card);border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:22px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
/* home */
.hello{text-align:center;padding:12px 0 20px}
.hello h1{font-size:clamp(32px,6vw,52px)}
.hello p{color:var(--muted);font-size:19px;margin:6px 0 0}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.kid{border-radius:32px;padding:26px 22px;color:#fff;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;gap:6px;min-height:230px;transition:transform .15s}
.kid:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.kid .big{font-size:72px;line-height:1}
.kid h3{font-size:30px}
.kid span{font-weight:800;opacity:.95}
.kid .prog{margin-top:auto;background:rgba(255,255,255,.28);border-radius:999px;height:14px;overflow:hidden}
.kid .prog i{display:block;height:100%;background:#fff;border-radius:999px}
.note{margin-top:22px;background:var(--card);border-radius:22px;padding:16px 18px;color:var(--muted);font-size:16px;line-height:1.5}
/* map */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.act{background:var(--card);border-radius:26px;padding:18px 16px;text-align:left;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;border:3px solid transparent}
.act .ico{font-size:46px;line-height:1}
.act b{font-family:var(--display);font-size:21px;line-height:1.15}
.act small{color:var(--muted);font-weight:700;font-size:14px}
.act.done{border-color:var(--sun)}
.act.done::after{content:"⭐";position:absolute;top:10px;right:12px;font-size:30px;font-family:'Apple Color Emoji','Noto Color Emoji',sans-serif}
.tag{align-self:flex-start;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;color:#fff}
/* play */
.stage{background:var(--card);border-radius:32px;padding:22px clamp(16px,3vw,32px) 26px;box-shadow:0 6px 0 var(--line);min-height:60vh;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
.qrow{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.q{font-family:var(--display);font-size:clamp(22px,3.6vw,32px);font-weight:700;max-width:30ch}
.say{width:58px;height:58px;border-radius:50%;background:var(--sea);color:#fff;font-size:26px;flex:none;box-shadow:0 4px 0 #1d5fbf}
.show{font-size:clamp(44px,9vw,78px);line-height:1.15;letter-spacing:4px;word-break:break-word}
.sent{font-size:clamp(20px,3vw,26px);font-weight:800;max-width:34ch}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 10px;background:#f3f0ff;border-radius:18px;padding:12px 14px;font-weight:800;font-size:16px;width:100%;text-align:left}
.key .emo{font-size:24px;margin-right:4px}
.opts{display:grid;gap:14px;width:100%;max-width:760px}
.opts.c2{grid-template-columns:repeat(2,1fr)}.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c4{grid-template-columns:repeat(4,1fr)}.opts.c5{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.opts.c4,.opts.c5{grid-template-columns:repeat(2,1fr)}.opts.c3{grid-template-columns:repeat(3,1fr)}}
.opt{min-height:88px;border-radius:24px;background:#fff;border:4px solid var(--line);font-family:var(--display);font-size:clamp(22px,3.4vw,30px);font-weight:700;padding:8px 10px;box-shadow:0 5px 0 var(--line);transition:transform .1s}
.opt.txt{font-family:var(--body);font-size:clamp(17px,2.4vw,21px);font-weight:800;line-height:1.25}
.opt .emo{font-size:clamp(42px,7vw,60px)}
.opt:active{transform:translateY(3px)}
.opt.ok{border-color:var(--good);background:#e6f8f0}
.opt.no{border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ball{display:inline-block;width:64px;height:64px;border-radius:50%;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12)}
.fb{min-height:34px;font-weight:800;font-size:20px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.next{background:var(--leaf);color:#fff;border-radius:22px;padding:14px 34px;font-family:var(--display);font-size:26px;box-shadow:0 5px 0 #168a61}
.next.alt{background:var(--sea);box-shadow:0 5px 0 #1d5fbf}
/* maze */
.maze{display:grid;touch-action:none;background:#fff;border:5px solid var(--ink);border-radius:8px;width:min(92vw,560px);aspect-ratio:1}
.maze div{position:relative;display:flex;align-items:center;justify-content:center}
.maze .p{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,76px);gap:8px}
.pad button{background:var(--grape);color:#fff;border-radius:22px;font-size:34px;box-shadow:0 5px 0 #5a43d6}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
/* sudoku */
.sud{display:grid;grid-template-columns:repeat(6,1fr);width:min(92vw,480px);border:4px solid var(--ink);border-radius:10px;overflow:hidden}
.sud button{aspect-ratio:1;font-family:var(--display);font-size:clamp(24px,5vw,34px);border-right:1px solid #c9c2d8;border-bottom:1px solid #c9c2d8;background:#fff}
.sud button.g{color:var(--ink);background:#f6f2ea}
.sud button.u{color:var(--sea)}
.sud button.sel{background:#fff2c9}
.sud button.br{border-right:4px solid var(--ink)}
.sud button.bb{border-bottom:4px solid var(--ink)}
.sud button.wrong{color:var(--bad);background:#ffe5ea}
.nums{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.nums button{width:66px;height:66px;border-radius:20px;background:var(--sea);color:#fff;font-family:var(--display);font-size:32px;box-shadow:0 5px 0 #1d5fbf}
/* scramble */
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slots i{width:52px;height:60px;border-bottom:5px solid var(--grape);font-family:var(--display);font-size:38px;font-style:normal;color:var(--grape)}
.letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.letters button{width:64px;height:64px;border-radius:18px;background:#fff1d6;border:3px solid var(--sun);font-family:var(--display);font-size:34px;box-shadow:0 4px 0 #e5a52a}
.letters button:disabled{opacity:.25}
/* breath */
.flower{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#ffd36e 0 22%,#ff8fab 23% 100%);transform:scale(.55);transition:transform 4s ease-in-out;display:flex;align-items:center;justify-content:center;font-size:60px}
.flower.in{transform:scale(1)}
.petals{font-size:44px;letter-spacing:6px}
textarea{width:100%;max-width:700px;min-height:180px;border-radius:20px;border:3px solid var(--line);padding:14px;font:inherit;font-size:20px;line-height:1.6;color:var(--ink);background:#fffdf8;user-select:text;-webkit-user-select:text}
/* celebrate */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-60px;font-size:34px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.win{font-size:96px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

const $=s=>document.querySelector(s), app=$('#app');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const doneKey=k=>'done-'+LESSON.id+'-'+k;
const totalKey='stars-total';
let AC;
function tone(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;(ok?[523,659,784]:[220,180]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.1);g.gain.exponentialRampToValueAtTime(.25,t+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.1+.25);o.connect(g).connect(AC.destination);o.start(t+i*.1);o.stop(t+i*.1+.3)})}catch(e){}}
let VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
function pickVoice(lang){const L=lang.toLowerCase();const m=VOICES.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase()===L);const p=m.find(v=>/premium|enhanced|siri/i.test(v.name))||m[0];return p||VOICES.find(v=>v.lang&&v.lang.slice(0,2).toLowerCase()===L.slice(0,2))}
let unlocked=false;
function unlock(){if(unlocked)return;unlocked=true;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0)}catch(e){}
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}loadVoices()}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
let curAudio=null;
function speak(text,lang){if(CLIPS[text]){try{if(curAudio)curAudio.pause();curAudio=new Audio(CLIPS[text]);curAudio.play().catch(()=>{});try{speechSynthesis.cancel()}catch(e){}return}catch(e){}}
  try{const s=window.speechSynthesis;if(!s)return;if(!VOICES.length)loadVoices();
  const u=new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\s.,!?'’:;-]/gu,' ').replace(/\s+/g,' ').trim());u.lang=lang;u.rate=lang.startsWith('en')?.85:.95;u.volume=1;const v=pickVoice(lang);if(v)u.voice=v;
  if(s.speaking||s.pending){s.cancel();setTimeout(()=>s.speak(u),80)}else s.speak(u);if(s.paused)s.resume()}catch(e){}}
function confetti(n=24){const c=$('#cf');const set=['⭐','🎉','💖','🌟','🎈','✨'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='emo';s.textContent=set[i%set.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.5+'s';c.appendChild(s);setTimeout(()=>s.remove(),2300)}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stars(){return store.get(totalKey,0)}
function markDone(kid,i){const d=store.get(doneKey(kid),[]);if(!d.includes(i)){d.push(i);store.set(doneKey(kid),d);store.set(totalKey,stars()+1)}}
function topbar(title,backFn){return `<div class="top"><button class="back" id="bk" aria-label="Quay lại">⬅️</button><h2>${title}</h2><div class="starbox"><span class="emo">⭐</span> ${stars()}</div></div>`}
function bindBack(fn){$('#bk').onclick=fn}

function home(){
  const card=k=>{const K=LESSON.kids[k];const d=store.get(doneKey(k),[]).length;return `<button class="kid" style="background:${K.grad}" data-k="${k}"><div class="big emo">${K.icon}</div><h3>${K.title}</h3><span>${K.name} · ${d}/${K.acts.length} bài</span><div class="prog"><i style="width:${d/K.acts.length*100}%"></i></div></button>`};
  app.innerHTML=`<div class="hello"><h1>Lớp học của hai chị em <span class="emo">🌈</span></h1><p>${LESSON.date} · Chủ đề: ${LESSON.theme}</p></div>
  <div class="kids">${card('k5')}${card('k8')}</div>
  <div class="starbox" style="margin:18px auto 0;width:max-content"><span class="emo">⭐</span> Tổng sao: ${stars()}</div>
  <div class="note"><b>Dành cho bố mẹ:</b> chạm <span class="emo">🔊</span> để nghe đọc câu hỏi (tiếng Việt và tiếng Anh). Nên dùng iPad khoảng 15–20 phút mỗi bé, phần còn lại học trên phiếu in. Không nghe tiếng? Gạt nút im lặng bên hông iPad (hoặc tắt chế độ Im lặng trong Trung tâm điều khiển), tăng âm lượng, rồi chạm nút <span class="emo">🔊</span>. Mẹo: trong Safari chọn Chia sẻ → “Thêm vào MH chính” để mở như một ứng dụng.<br><button class="next alt" id="test" style="margin-top:10px;font-size:20px;padding:10px 22px">🔊 Thử âm thanh</button></div>`;
  $('#test').onclick=()=>{tone(true);speak('Xin chào các con!','vi-VN');setTimeout(()=>speak('Hello! Let\'s learn English!','en-GB'),1800)};
  app.querySelectorAll('.kid').forEach(b=>b.onclick=()=>{speak(LESSON.kids[b.dataset.k].title,'vi-VN');map(b.dataset.k)});
}
function map(k){
  const K=LESSON.kids[k];const d=store.get(doneKey(k),[]);
  const tagc={'Trí tuệ':'var(--sea)','Cảm xúc':'var(--berry)','English':'var(--leaf)'};
  app.innerHTML=topbar(`<span class="emo">${K.icon}</span> ${K.title}`)+`<div class="acts">${K.acts.map((a,i)=>`<button class="act ${d.includes(i)?'done':''}" data-i="${i}"><span class="ico emo">${a.icon}</span><b>${a.title}</b><span class="tag" style="background:${tagc[a.tag]}">${a.tag}</span></button>`).join('')}</div>`;
  bindBack(home);
  app.querySelectorAll('.act').forEach(b=>b.onclick=()=>play(k,+b.dataset.i));
}
function finish(k,i,extra=''){
  markDone(k,i);tone(true);confetti(40);
  const K=LESSON.kids[k];const nx=i+1<K.acts.length;
  app.innerHTML=topbar(K.acts[i].title)+`<div class="stage"><div class="win emo">🏆</div><h2 style="font-size:40px">Giỏi quá!</h2><p class="sent">Con được thêm 1 ngôi sao <span class="emo">⭐</span></p>${extra}<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">${nx?`<button class="next" id="nx">Bài tiếp theo ➜</button>`:''}<button class="next alt" id="mp">Về bản đồ</button></div></div>`;
  bindBack(()=>map(k));speak('Giỏi quá!','vi-VN');
  if(nx)$('#nx').onclick=()=>play(k,i+1);$('#mp').onclick=()=>map(k);
}
function play(k,i){const a=LESSON.kids[k].acts[i];({choice:pChoice,maze:pMaze,sudoku:pSud,breath:pBreath,scramble:pScr,write:pWrite})[a.type](k,i,a)}

function pChoice(k,i,a){
  let r=0;
  const draw=()=>{
    const R=a.rounds[r];const n=R.opts.length;const cols=a.cols||n;
    const qLang=a.en&&!/[ăâđêôơư]/i.test(R.q)&&!R.q.startsWith('Nghe')&&!R.q.startsWith('Chạm')?'en-GB':'vi-VN';
    app.innerHTML=topbar(a.title)+`<div class="stage">
      <div class="dots">${a.rounds.map((_,j)=>`<i class="${j<r?'on':''}"></i>`).join('')}</div>
      ${a.clue?`<div class="key" style="display:block;font-size:18px">${a.clue}</div>`:''}
      ${a.key?`<div class="key">${a.key.map(x=>`<span><span class="emo">${x[0]}</span>= ${x[1]}</span>`).join('')}</div>`:''}
      <div class="qrow"><button class="say" id="say" aria-label="Nghe">🔊</button><div class="q">${R.q}</div></div>
      ${R.show?`<div class="show emo">${R.show}</div>`:''}
      <div class="opts c${Math.min(cols,n)}">${R.opts.map((o,j)=>`<button class="opt ${a.txt?'txt':''}" data-j="${j}">${typeof o==='object'?o.h:(/\p{Extended_Pictographic}/u.test(o)&&o.length<=4?`<span class="emo">${o}</span>`:esc(o))}</button>`).join('')}</div>
      <div class="fb" id="fb"></div></div>`;
    bindBack(()=>map(k));
    const sayQ=()=>{if(R.say)speak(R.say,'en-GB');else speak(R.q,qLang)};
    $('#say').onclick=()=>{if(R.say&&R.q!==R.say){speak(R.say,'en-GB')}else sayQ()};
    setTimeout(()=>{if(R.say)speak(R.say,'en-GB');else if(k==='k5')speak(R.q,'vi-VN')},300);
    let locked=false;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;const j=+b.dataset.j;const good=Array.isArray(R.a)?R.a.includes(j):j===R.a;
      if(a.sayOpts&&typeof R.opts[j]==='string')speak(R.opts[j],'en-GB');
      if(good){locked=true;b.classList.add('ok');tone(true);confetti(10);
        const msg=R.ok||a.ok||['Đúng rồi!','Giỏi quá!','Tuyệt vời!','Xuất sắc!'][r%4];
        $('#fb').className='fb good';$('#fb').textContent=msg+' ⭐';
        setTimeout(()=>{if(R.okSay)speak(R.okSay,'en-GB');else speak(msg,'vi-VN')},a.sayOpts?700:150);
        setTimeout(()=>{r++;if(r<a.rounds.length)draw();else finish(k,i,a.final?`<div class="key" style="display:block;font-size:22px;text-align:center">${a.final}</div>`:'')},R.okSay?2600:1700);
        if(a.final&&r===a.rounds.length-1)setTimeout(()=>speak(a.final,'vi-VN'),2700);
      }else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');tone(false);
        const m=R.no||a.no||'Chưa đúng, con thử lại nhé!';$('#fb').className='fb bad';$('#fb').textContent=m;if(k==='k5'||R.no)speak(m,'vi-VN')}
    });
  };draw();
}
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function genMaze(n,seed){const R=rng(seed);const W=[...Array(n)].map(()=>[...Array(n)].map(()=>({t:1,r:1,b:1,l:1})));const seen=[...Array(n)].map(()=>Array(n).fill(false));const st=[[0,0]];seen[0][0]=true;
  while(st.length){const [y,x]=st[st.length-1];const nb=[[y-1,x,'t','b'],[y+1,x,'b','t'],[y,x-1,'l','r'],[y,x+1,'r','l']].filter(([yy,xx])=>yy>=0&&xx>=0&&yy<n&&xx<n&&!seen[yy][xx]);
    if(!nb.length){st.pop();continue}const [yy,xx,w1,w2]=nb[Math.floor(R()*nb.length)];W[y][x][w1]=0;W[yy][xx][w2]=0;seen[yy][xx]=true;st.push([yy,xx])}return W}
function pMaze(k,i,a){
  const n=a.n,W=genMaze(n,a.seed);let y=0,x=0;const bw=n>8?3:5;
  app.innerHTML=topbar(a.title)+`<div class="stage"><div class="qrow"><button class="say" id="say">🔊</button><div class="q">${a.q}</div></div>
   <div class="maze" id="mz" style="grid-template-columns:repeat(${n},1fr)">${W.map((row,yy)=>row.map((c,xx)=>`<div style="border-top:${c.t?bw:0}px solid var(--ink);border-left:${c.l?bw:0}px solid var(--ink);border-right:${c.r?bw:0}px solid var(--ink);border-bottom:${c.b?bw:0}px solid var(--ink);font-size:${n>8?'clamp(18px,4vw,34px)':'clamp(30px,7vw,56px)'}" id="c${yy}_${xx}">${yy===n-1&&xx===n-1?`<span class="emo">${a.end}</span>`:''}</div>`).join('')).join('')}</div>
   <div class="pad"><button class="u" data-d="u">⬆️</button><button class="l" data-d="l">⬅️</button><button class="d" data-d="d">⬇️</button><button class="r" data-d="r">➡️</button></div></div>`;
  bindBack(()=>map(k));$('#say').onclick=()=>speak(a.q,'vi-VN');
  const trail=new Set();
  const put=()=>{app.querySelectorAll('.p').forEach(e=>e.remove());const c=$(`#c${y}_${x}`);trail.add(`${y}_${x}`);c.style.background='#fff2c9';const p=document.createElement('span');p.className='p emo';p.textContent=a.start;c.appendChild(p);
    if(y===n-1&&x===n-1)setTimeout(()=>finish(k,i),400)};
  const mv=d=>{const c=W[y][x];if(d==='u'&&!c.t)y--;else if(d==='d'&&!c.b)y++;else if(d==='l'&&!c.l)x--;else if(d==='r'&&!c.r)x++;else{tone(false);return}put()};
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>mv(b.dataset.d));
  let sx,sy;const mz=$('#mz');mz.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  mz.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;mv(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});
  document.onkeydown=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m&&$('#mz')){e.preventDefault();mv(m)}};
  put();if(k==='k5')setTimeout(()=>speak(a.q,'vi-VN'),300);
}
function pSud(k,i,a){
  const P=a.puz.split('|').map(r=>[...r]),S=a.sol.split('|').map(r=>[...r]);const G=P.map(r=>r.map(c=>c==='_'?'':c));let sel=null;
  const draw=()=>{app.innerHTML=topbar(a.title)+`<div class="stage"><div class="q">Điền số 1–6: mỗi hàng, mỗi cột, mỗi ô chữ nhật đậm có đủ 6 số</div>
    <div class="sud">${G.map((r,y)=>r.map((v,x)=>`<button class="${P[y][x]!=='_'?'g':'u'} ${x===2?'br':''} ${y===1||y===3?'bb':''} ${sel&&sel[0]===y&&sel[1]===x?'sel':''} ${v&&v!==S[y][x]?'wrong':''}" data-y="${y}" data-x="${x}">${v}</button>`).join('')).join('')}</div>
    <div class="nums">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="" style="background:var(--muted);box-shadow:0 5px 0 #4b4560">⌫</button></div><div class="fb" id="fb"></div></div>`;
    bindBack(()=>map(k));
    app.querySelectorAll('.sud button').forEach(b=>b.onclick=()=>{const y=+b.dataset.y,x=+b.dataset.x;if(P[y][x]!=='_')return;sel=[y,x];draw()});
    app.querySelectorAll('.nums button').forEach(b=>b.onclick=()=>{if(!sel){$('#fb').className='fb bad';$('#fb').textContent='Chạm vào một ô trống trước nhé!';return}
      const [y,x]=sel;G[y][x]=b.dataset.n;if(b.dataset.n){tone(b.dataset.n===S[y][x])}draw();
      if(G.every((r,y)=>r.every((v,x)=>v===S[y][x])))setTimeout(()=>finish(k,i),400)});
  };draw();
}
function pBreath(k,i,a){
  let n=0,busy=false;
  const draw=()=>{app.innerHTML=topbar(a.title)+`<div class="stage"><div class="q">Khi giận hay buồn, mình làm phép thuật này nhé!</div>
    <div class="flower emo" id="fl">🌷</div><div class="sent" id="tx">Chạm nút để bắt đầu</div>
    <div class="petals emo">${[...Array(a.times)].map((_,j)=>j<n?'🌸':'⚪').join('')}</div>
    <button class="next" id="go">${n?'Lần nữa':'Bắt đầu'}</button></div>`;bindBack(()=>map(k));
    $('#go').onclick=()=>{if(busy)return;busy=true;$('#go').style.visibility='hidden';const fl=$('#fl'),tx=$('#tx');
      tx.textContent='🌷 Hít vào… ngửi bông hoa';speak('Hít vào thật sâu, ngửi bông hoa','vi-VN');fl.classList.add('in');
      setTimeout(()=>{tx.textContent='🕯️ Thở ra… thổi nến thật chậm';speak('Thở ra thật chậm, thổi nến','vi-VN');fl.classList.remove('in');fl.textContent='🕯️'},4200);
      setTimeout(()=>{n++;busy=false;tone(true);if(n>=a.times)finish(k,i,'<p class="sent">Con thấy bình tĩnh hơn chưa? <span class="emo">😊</span></p>');else draw()},8600)};
  };draw();
}
function pScr(k,i,a){
  let r=0;
  const draw=()=>{const R=a.rounds[r];const R2=rng(r+3);const letters=[...R.w].map((c,j)=>({c,j})).sort(()=>R2()-.5);let typed=[];
    const paint=()=>{app.innerHTML=topbar(a.title)+`<div class="stage"><div class="dots">${a.rounds.map((_,j)=>`<i class="${j<r?'on':''}"></i>`).join('')}</div>
      <div class="qrow"><button class="say" id="say">🔊</button><div class="q">Look and write the word</div></div>
      <div class="show emo">${R.show}</div><div class="slots">${[...R.w].map((_,j)=>`<i>${typed[j]?typed[j].c:''}</i>`).join('')}</div>
      <div class="letters">${letters.map((l,j)=>`<button data-j="${j}" ${typed.includes(l)?'disabled':''}>${l.c}</button>`).join('')}</div>
      <div style="display:flex;gap:12px"><button class="next alt" id="del">⌫ Xoá</button></div><div class="fb" id="fb"></div></div>`;
      bindBack(()=>map(k));$('#say').onclick=()=>speak(R.w,'en-GB');
      $('#del').onclick=()=>{typed.pop();paint()};
      app.querySelectorAll('.letters button').forEach(b=>b.onclick=()=>{typed.push(letters[+b.dataset.j]);
        if(typed.length===R.w.length){const w=typed.map(t=>t.c).join('');if(w===R.w){tone(true);confetti(10);speak(R.w,'en-GB');paint();$('#fb').className='fb good';$('#fb').textContent=`${R.w}! Well done! ⭐`;setTimeout(()=>{r++;r<a.rounds.length?draw():finish(k,i)},1800);return}
          else{tone(false);paint();$('#fb').className='fb bad';$('#fb').textContent='Chưa đúng. Chạm 🔊 để nghe rồi thử lại nhé!';setTimeout(()=>{typed=[];paint()},1300);return}}
        paint()});
    };paint();
  };draw();
}
function pWrite(k,i,a){
  const key='write-'+LESSON.id+'-'+k+'-'+i;
  app.innerHTML=topbar(a.title)+`<div class="stage"><div class="qrow"><button class="say" id="say">🔊</button><div class="q">${a.q}</div></div>
   <textarea id="tw" placeholder="${esc(a.ph)}">${esc(store.get(key,''))}</textarea><button class="next" id="ok">Xong rồi!</button><div class="fb" id="fb"></div></div>`;
  bindBack(()=>map(k));$('#say').onclick=()=>speak(a.q,'vi-VN');
  $('#tw').oninput=e=>store.set(key,e.target.value);
  $('#ok').onclick=()=>{if($('#tw').value.trim().length<10){$('#fb').className='fb bad';$('#fb').textContent='Con viết thêm một chút nữa nhé!';return}finish(k,i,'<p class="sent">Giờ con đọc to lá thư cho em nghe nhé! 💌</p>')};
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
home();
