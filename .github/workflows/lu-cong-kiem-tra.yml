name: Lu - cong kiem tra
on:
  pull_request:
    paths: ['lu/**', '.github/workflows/lu-cong-kiem-tra.yml']
  push:
    branches: [main]
    paths: ['lu/**']
jobs:
  cong:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Cong kiem tra bai 1
        run: node tools/cong-kiem-tra.mjs L001
