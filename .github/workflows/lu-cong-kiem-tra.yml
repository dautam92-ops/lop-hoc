name: Lu - cong kiem tra
on:
  pull_request:
    paths: ['lu/**', '.github/workflows/lu-cong-kiem-tra.yml']
  push:
    branches: [main]
    paths: ['lu/**']
jobs:
  cong:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Cong kiem tra bai 1
        run: node tools/cong-kiem-tra.mjs L001
      # Mọi lỗi tam đã báo có phép thử trong Phòng mẫu (SO-LOI.md); PR nào làm lỗi cũ quay lại sẽ bị chặn (tam 26/11 18:40)
      - name: Phong mau - noi dung
        if: always()
        run: node tools/lab/check-samples.mjs
      - name: Phong mau - choi that tren iPad va dien thoai
        if: always()
        run: node tools/lab/test-lab.mjs
